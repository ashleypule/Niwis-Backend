[project]
name = "niwis-backend"
version = "0.1.0"
description = "NIWIS backend API (Department of Water and Sanitation, South Africa)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "asyncpg>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "pyyaml>=6",
  "cachetools>=5.5",
  "pandas>=2.2",
  "numpy>=2.0",
  "scipy>=1.14",
  "pymannkendall>=1.4.3",
  "shapely>=2.0",
  "python-dateutil>=2.9",
  "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML",
  "types-cachetools",
  "asyncpg-stubs",
  "types-python-dateutil",
  "psycopg[binary]>=3.2",
]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["reference", "migrations"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = [
  "S101",   # assert in tests
  "S608",   # SQL built from registry identifiers only (validated + quoted); values are always bind parameters
  "RUF001", "RUF002", "RUF003",  # unicode units (°C, m³) are intentional
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header", "fastapi.Path"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["S", "E501"]
"tests/*" = ["S"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["app"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pymannkendall.*", "shapely.*", "scipy.*", "pandas.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = [
  "db: needs the local fixture Postgres (docker compose --profile test up -d testdb)",
  "integration: read-only checks against the real Supabase database (opt-in: pytest -m integration)",
]
addopts = "-m 'not integration' --basetemp=.pytest_tmp -p no:cacheprovider"
