# gitleaks configuration: the default rules plus an allowlist of verified false positives (2026-10-21 full-history
# scan; see SECURITY.md). Keep it narrow: never allowlist a real credential, rotate it instead.
[extend]
useDefault = true

[allowlist]
description = "verified false positives"
regexTarget = "match"
paths = [
  # synthetic credentials used to test log scrubbing (tests/test_security.py: "s3cret", a fake JWT)
  '''(^|/)tests/test_security\.py$''',
]
regexes = [
  # database column names quoted in docs (e.g. Daily_Surface_Runoff_Volume_m3_day)
  '''`[A-Za-z][A-Za-z0-9]*(_[A-Za-z0-9]+){2,}`''',
]
