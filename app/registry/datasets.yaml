datasets:
  # ------------------------------------------------------------------ DB Module 1 — Drought (spec §3)
  meteorological_drought_master:
    db_module: 1
    module: drought
    spec: "3.1"
    serves: [drought, rainfall, climate]
    category_modules: [drought]
    location: {column: district_name}
    time: {kind: date, column: date, resolution: daily, year: year, month: month}
    known_issues: ["31 December missing every year"]
    columns:
      daily_rainfall_mm_day:       {var: rain_daily, role: duplicate}
      monthly_rainfall_mm_month:   {var: rain_monthly, role: duplicate, repeats: monthly, note: "December totals miss 31 Dec"}
      seasonal_rainfall_mm_season: {var: rain_seasonal_met, role: withheld, repeats: annual,
                                    reason: "holds the calendar-year total, not a season: one value per district-year (Alfred Nzo 2014 = 825.67 mm = sum of its 12 monthly totals, 31 Dec missing)"}
      rainfall_anomaly_mm:         {var: rain_anomaly_mm, role: duplicate, repeats: monthly}
      rainfall_anomaly_pct:        {var: rain_anomaly_pct, role: duplicate, repeats: monthly}
      rainfall_intensity_mm_h:     {var: rain_intensity, role: duplicate}
      tmin_c:                      {var: tmin, role: duplicate}
      tmax_c:                      {var: tmax, role: duplicate}
      tavg_c:                      {var: tavg, role: duplicate}
      temp_anomaly_c:              {var: temp_anomaly, role: duplicate, repeats: monthly, note: "equals 4_1 to 0.001 °C"}
      pet_mm_day:                  {var: pet_daily, role: canonical}
      et0_mm_day:                  {var: et0_daily, role: canonical, note: "plausible 1–7.4 mm/day (the 4_4 table's ET₀ is withheld)"}
      relative_humidity_pct:       {var: rh, role: canonical}
      solar_radiation_wm2:         {var: solar_radiation, role: withheld,
                                    reason: "synthetic: one value per calendar day (365 distinct values), identical in all 52 districts and every year; peaks in April (247 W/m²) with the minimum in Sep–Oct (113 W/m²), where the Southern-Hemisphere maximum is in December"}
      wind_speed_2m_ms:            {var: wind_2m, role: withheld, reason: "constant 2.5 m/s in every row"}
      spi_1:                       {var: spi_1, role: duplicate, repeats: monthly}
      spi_3:                       {var: spi_3, role: duplicate, repeats: monthly}
      spi_6:                       {var: spi_6, role: duplicate, repeats: monthly}
      spi_12:                      {var: spi_12, role: duplicate, repeats: monthly}
      spi_24:                      {var: spi_24, role: duplicate, repeats: monthly}
      spei_1:                      {var: spei_1, role: canonical, repeats: monthly}
      spei_3:                      {var: spei_3, role: canonical, repeats: monthly}
      spei_6:                      {var: spei_6, role: canonical, repeats: monthly}
      spei_12:                     {var: spei_12, role: canonical, repeats: monthly}
      spei_24:                     {var: spei_24, role: canonical, repeats: monthly}

  satellite_remote_sensing:
    db_module: 1
    module: drought
    spec: "3.2"
    serves: [drought, vegetation]
    category_modules: [drought, vegetation]
    location: {column: district_name}
    time: {kind: date, column: date, resolution: monthly, year: year}
    known_issues: ["ends 2025-12", "lowercase district names; 5 use other spellings"]
    columns:
      ndvi:                   {var: ndvi, role: canonical, note: "passes the NDVI plausibility check (arid west low, wet east high, seasonal cycle follows the rains)"}
      lst:                    {var: lst, role: canonical}
      ndwi:                   {var: ndwi, role: canonical}
      vci:                    {var: vci, role: canonical}
      tci:                    {var: tci, role: canonical}
      vhi:                    {var: vhi, role: canonical}
      rootzone_soil_moisture: {var: soil_moisture_rootzone, role: canonical, valid_from: 2015-03-01,
                               valid_reason: "one constant value per district from 2001 to Feb 2015 (a fill before the satellite record); real monthly values from Mar 2015"}
      surface_soil_moisture:  {var: soil_moisture_surface, role: canonical, valid_from: 2015-03-01,
                               valid_reason: "one constant value per district from 2001 to Feb 2015 (a fill before the satellite record); real monthly values from Mar 2015"}
      surface_water_extent_km2: {var: surface_water_extent, role: unused, note: "plausibility checked 2026-10-15: ≥ 0 everywhere, different in every district"}
      grace_tws:              {var: grace_tws, role: withheld,
                               reason: "values of 70–412 in 2001 and up to 270 in 2002, before GRACE data exist (launch March 2002); about ±10 from 2003; unit undocumented"}

  hydrological_drought_master:
    db_module: 1
    module: drought
    spec: "3.3"
    serves: [drought]
    category_modules: [drought, runoff]
    location: {column: district_name}
    time: {kind: date, column: date, resolution: monthly}
    known_issues: ["ends 2025-12", "lowercase district names"]
    columns:
      river_discharge_m3_s:       {var: river_discharge, role: withheld, reason: "identical value in all 52 districts every month (placeholder)"}
      fdc_percentiles_m3_s:       {var: fdc_percentile, role: withheld, reason: "constant 0.01"}
      ssi_dimensionless:          {var: ssi, role: withheld, reason: "computed from the placeholder discharge"}
      dam_storage_million_m3:     {var: dam_storage, role: withheld, reason: "failed plausibility: frozen since Dec 2021 in all 52 districts (national 17 715 Mm³ every month) and implausible swings before (national 421 Mm³ in Jun 2021, 16 617 Mm³ in Aug 2021)"}
      dam_level_pct_fsc:          {var: dam_level_pct, role: withheld, reason: "failed plausibility: frozen since Dec 2021; 1 212 district-months at 0 % FSC (national mean 69 % in Jul 2002, 0.5 % in Jul 2003)"}
      dam_inflow_m3_s:            {var: dam_inflow, role: withheld, reason: "failed plausibility: inflow = outflow in 2 496 of 2 600 district-months since Nov 2021 (storage frozen)"}
      dam_outflow_m3_s:           {var: dam_outflow, role: withheld, reason: "failed plausibility: inflow = outflow in 2 496 of 2 600 district-months since Nov 2021 (storage frozen)"}
      borehole_water_level_m_bgl: {var: gw_level, role: withheld, reason: "range −0.18…+0.20: not a depth below ground level"}
      sgi_dimensionless:          {var: sgi, role: canonical, valid_from: 2002-05-01, valid_until: 2024-08-01,
                                   valid_reason: "values after Aug 2024 repeat Aug 2024 and are withheld; Jan 2001 – Apr 2002 is a constant spin-up. Johannesburg, Ekurhuleni, Sedibeng and West Rand share one identical series, as do Sisonke and uMgungundlovu"}
      surface_runoff_m3_s:        {var: surface_runoff_flow, role: withheld, reason: "identical value in all 52 districts every month (placeholder)"}
      baseflow_separation_m3_s:   {var: baseflow_flow, role: withheld, reason: "identical value in all 52 districts every month (placeholder)"}

  # ------------------------------------------------------------------ DB Module 2 — Climate (spec §4)
  "4_1_temperature_change_master":
    db_module: 2
    module: climate
    serves: [climate]
    location: {column: District_Name}
    time: {kind: text_date, column: Date, resolution: daily}
    known_issues: ["31 December missing every year", "Date stored as text", "no primary key or index"]
    columns:
      Tmin_C:                                 {var: tmin, role: canonical}
      Tmax_C:                                 {var: tmax, role: canonical}
      Tavg_C:                                 {var: tavg, role: canonical}
      Temperature_Anomaly_C:                  {var: temp_anomaly, role: canonical, repeats: monthly}
      Heatwave_Frequency_Days:                {var: hot_days, role: canonical, repeats: annual, note: "= count of days Tmax > 35 °C in the year (verified)"}
      Heatwave_Duration_Max_Consecutive_Days: {var: heatwave_duration, role: canonical, repeats: annual, note: "= longest run of days with Tmax > 35 °C in the year (1 404 / 1 404 district-years verified)"}
      Frost_Day_Flag:                         {var: frost_day, role: canonical}
      LST_Day_C:                              {var: lst_day, role: canonical}
      LST_Night_C:                            {var: lst_night, role: canonical}

  "4_2_wet_dry_spells_master":
    db_module: 2
    module: climate
    serves: [climate, rainfall]
    category_modules: [climate, rainfall]
    location: {column: District_Name}
    time: {kind: year, column: Year, resolution: annual}
    known_issues: ["2026 is a partial year"]
    columns:
      CWD_Days:            {var: cwd, role: canonical}
      CDD_Days:            {var: cdd, role: canonical}
      Rx1day_mm:           {var: rx1day, role: canonical}
      Rx5day_mm:           {var: rx5day, role: canonical}
      PRCPTOT_mm:          {var: prcptot, role: canonical}
      R10mm_Days:          {var: r10mm, role: canonical}
      R20mm_Days:          {var: r20mm, role: canonical}
      SDII_mm_per_wet_day: {var: sdii, role: canonical}

  "4_3_mean_annual_precipitation_master":
    db_module: 2
    module: climate
    serves: [climate, rainfall]
    category_modules: [climate, rainfall]
    location: {column: District_Name}
    time: {kind: year, column: Year, resolution: annual}
    known_issues: ["2026 is a partial year", "Nino34_Annual_Mean 2026 = −41.28 (excluded with the partial year)"]
    columns:
      MAP_mm:                  {var: rain_annual, role: canonical, note: "identical to 6.1 Annual_Total_Precipitation_mm"}
      Precip_DJF_mm:           {var: rain_season_djf, role: canonical}
      Precip_MAM_mm:           {var: rain_season_mam, role: canonical}
      Precip_JJA_mm:           {var: rain_season_jja, role: canonical}
      Precip_SON_mm:           {var: rain_season_son, role: canonical}
      Nino34_Annual_Mean:      {var: nino34_annual, role: canonical, note: "−0.85 … +1.55 for 2000–2025; the 2026 value (−41.28) belongs to the partial year, which is never served"}
      Precip_CV_Percent:       {var: rain_cv, role: withheld, repeats: record, reason: "computed over 2000–2026 including the partial year 2026 (Alfred Nzo 17.05 %; 14.70 % over 2000–2025)"}
      MK_Sens_Slope_mm_yr:     {var: rain_trend_sen, role: withheld, repeats: record, reason: "computed over 2000–2026 including the partial year 2026: Alfred Nzo −1.03 mm/yr stored, +0.22 mm/yr over the full years 2000–2025 (app.core.stats)"}
      MK_p_value:              {var: rain_trend_mk_p, role: withheld, repeats: record, reason: "computed over 2000–2026 including the partial year 2026 (same test as MK_Sens_Slope_mm_yr)"}
      MK_Trend:                {var: rain_trend_mk, role: withheld, repeats: record, reason: "computed over 2000–2026 including the partial year 2026 (same test as MK_Sens_Slope_mm_yr)"}
      ENSO_Nino34_Correlation: {var: enso_correlation, role: withheld, repeats: record, reason: "includes 2026, whose Niño 3.4 value is −41.28: Alfred Nzo +0.48 stored, −0.43 over 2000–2025"}

