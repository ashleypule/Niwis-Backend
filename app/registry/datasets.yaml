      "pct_fsc": {var: res_pct_fsc, role: withheld, reason: "51 of 52 districts hold the same storage (251 997 542.57 m³ = 100 % FSC, level 1 200 m, 52.5 km² water area) on every day from January 2000 to October 2026; only Vhembe varies"}
